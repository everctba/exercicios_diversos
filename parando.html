<meta charset="utf-8">
<style>
   * {
      margin: 0;
      padding: 0;
      line-height: 1.7;
   }
</style>

<script>

   let saldo = 100, jogoA, JogoB, maiorValor = 0, resultadoAleatorio, i = 0;

   while (saldo > 0 && saldo < 500) {
      i = i + 1;
      resultadoAleatorio = Math.random();
      document.write("1  resultadoAleatorio = " + resultadoAleatorio + "<br>");
      //definer resultado dos jogos
      //Aqui jogo A eu  só vendo
      if (resultadoAleatorio > 0.5) {
         jogoA = -1;
      }
      else {
         jogoA = 1;
      }

      //Aqui jogo B eu só compro procurando VB de alta
      if (resultadoAleatorio < 0.666) {
         jogoB = -1;
      }
      else {
         jogoB = 2;
      }
      document.write("2 Resultado Jogo B = " + jogoB + "<br>");
      document.write("3 Resultado Jogo A = " + jogoA + "<br>");

      //Logica de saldo
      document.write("4 Saldo atual R$ " + saldo + "<br>");


      if (saldo % 3 === 0) {
         document.write("5 Saldo é divisivel por 3 = " + saldo + "<br>");
         saldo = saldo + jogoB;
      }

      document.write("6 Saldo não é divisivel por 3 = " + saldo + "<br>");
      saldo = saldo + jogoA;
      document.write("DEGUB: Saldo  ATUALIZADO = " + saldo + "<br>");

      if (saldo > maiorValor) {
         maiorValor = saldo;
      }
      document.write("7 Iterações = " + i + "<br>");
      document.write("8 O maior valor foi = " + maiorValor + "<br>");

   }

   document.write("O maior valor foi = " + maiorValor + "<br>");


</script>
